events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5M;

    # Rate limiting
    # auth-write: 20/min burst 8 — covers register+login flow (3 calls) plus retry bursts
    limit_req_zone $binary_remote_addr zone=auth_write:10m rate=20r/m;
    # auth-read: 30/min for /me, /refresh, /verify — looser, since these are idempotent reads
    limit_req_zone $binary_remote_addr zone=auth_read:10m rate=30r/m;
    # api: 60/s burst 60 — general API budget per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    upstream backend {
        server backend:8000;
    }

    # HTTP → HTTPS redirect (uncomment for production with SSL)
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        # Media files
        location /media/ {
            alias /var/www/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend static
        location / {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;
            expires 1h;
        }

        # API with rate limiting (general API budget; auth sub-locations have their own)
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/auth/me and /api/auth/refresh — read-only/idempotent, looser budget
        location ~^/api/auth/(me|refresh)$ {
            limit_req zone=auth_read burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/auth/logout — also read-friendly, uses auth_read too
        location = /api/auth/logout {
            limit_req zone=auth_read burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Strict limit for write/auth endpoints (register, login, verify-request, verify)
        location ~^/api/auth/(register|login|verify-request|verify)$ {
            limit_req zone=auth_write burst=8 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck (no rate limit)
        location /api/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server (uncomment for production with SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # ... same location blocks as above ...
    # }
}
