app = "flashcards"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "Flashcards"
  APP_VERSION = "2.0.0"
  DEBUG = "false"
  MEDIA_ROOT = "/data/media"
  MEDIA_URL = "/media"
  SECURE_COOKIES = "true"
  RATE_LIMIT_ENABLED = "true"

[[mounts]]
  source = "flashcards_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/api/health"
  protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
