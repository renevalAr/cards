services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend:/var/www/frontend:ro
      - ./media:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-flashcards}:${POSTGRES_PASSWORD:-flashcards}@db:5432/${POSTGRES_DB:-flashcards}
      - SECRET_KEY=${SECRET_KEY:-super-secret-dev-key-change-in-prod}
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-["localhost","*.localhost","testserver"]}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@flashcards.app}
      - EMAIL_VERIFY_URL=${EMAIL_VERIFY_URL:-http://localhost:8000/api/auth/verify}
      - PYTHONPATH=/app
    volumes:
      - ./media:/var/www/media
    depends_on:
      db:
        condition: service_healthy
    # Prometheus: scrape /api/metrics (no auth required)
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/api/metrics"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-flashcards}
      - POSTGRES_USER=${POSTGRES_USER:-flashcards}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flashcards}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
