services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend:/var/www/frontend:ro
      - ./media:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-flashcards}:${POSTGRES_PASSWORD:-flashcards}@db:5432/${POSTGRES_DB:-flashcards}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@flashcards.app}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost"]}
      - PYTHONPATH=/app
      - RATE_LIMIT_ENABLED=false
    volumes:
      - ./media:/var/www/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-flashcards}
      - POSTGRES_USER=${POSTGRES_USER:-flashcards}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flashcards}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
